name: Build LineageOS for LJ6

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: LineageOS branch
        required: true
        default: lineage-23.2
        type: choice
        options:
          - lineage-23.2
          - lineage-22.2
          - lineage-22.1
          - lineage-21.0
      build_type:
        description: Build type
        required: true
        default: userdebug
        type: choice
        options:
          - userdebug
          - eng
      ccache_size:
        description: CCache size (GB)
        required: true
        default: "5"
        type: string

env:
  DEVICE: LJ6
  BRAND: TECNO
  BUILD_TYPE: ${{ inputs.build_type }}
  LINEAGE_BRANCH: ${{ inputs.lineage_branch }}
  DEVICE_TREE_URL: https://github.com/bradarwhatisdis/android_device_tecno_LJ6
  VENDOR_TREE_URL: https://github.com/bradarwhatisdis/android_vendor_tecno_LJ6
  VENDOR_COMMON_URL: https://github.com/bradarwhatisdis/android_vendor_tecno_mt6789-common
  CCACHE_DIR: /home/runner/.ccache
  USE_CCACHE: 1
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: ${{ inputs.ccache_size }}G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Aggressive)
        run: |
          echo "=== Before cleanup ==="
          df -h /

          # 1. Remove pre-installed SDKs & toolchains (biggest wins first)
          echo "--- Removing Android SDK (~12GB) ---"
          sudo rm -rf /usr/local/lib/android

          echo "--- Removing tool cache: Node, Go, Python, Ruby, etc (~8GB) ---"
          sudo rm -rf /opt/hostedtoolcache

          echo "--- Removing .NET (~2GB) ---"
          sudo rm -rf /usr/share/dotnet

          echo "--- Removing Haskell GHC (~1.5GB) ---"
          sudo rm -rf /opt/ghc /usr/local/.ghcup

          echo "--- Removing Swift (~3GB) ---"
          sudo rm -rf /usr/share/swift

          echo "--- Removing Julia (~0.5GB) ---"
          sudo rm -rf /usr/local/julia

          echo "--- Removing Azure CLI, AWS tools, Google Cloud SDK (~2GB) ---"
          sudo rm -rf /opt/az /usr/lib/az /usr/share/az
          sudo rm -rf /usr/local/aws /usr/local/aws-cli
          sudo rm -rf /usr/local/gcloud /usr/share/google-cloud-sdk
          sudo rm -rf /opt/google/chrome /opt/microsoft/msedge

          echo "--- Removing large packages (mono, llvm, php, ccache old versions) ---"
          sudo apt-get purge -y -qq mono-complete mono-devel mono-runtime llvm-* \
            php* ruby* r-base* mysql* postgresql* mongodb* 2>/dev/null || true

          echo "--- Removing remaining heavy directories ---"
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/miniconda
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /opt/pipx
          sudo rm -rf /opt/graalvm

          # 2. Clean package manager
          echo "--- Cleaning apt ---"
          sudo apt-get autoremove -y -qq 2>/dev/null || true
          sudo apt-get autoclean -y -qq 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/*.deb

          # 3. Remove ALL docker images & system resources
          echo "--- Docker cleanup (~3-4GB) ---"
          sudo docker system prune -af 2>/dev/null || true
          sudo docker rmi -f $(docker images -q) 2>/dev/null || true

          # 4. Clean up home directory caches
          echo "--- Cleaning home caches ---"
          rm -rf ~/.cache/pip ~/.cargo ~/.rustup ~/.npm /tmp/* 2>/dev/null || true

          echo "=== After cleanup ==="
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            libncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev \
            libc6-dev-i386 libncurses6 python3 python3-pip \
            patchelf android-sdk-libsparse-utils
          sudo apt-get install -y \
            openjdk-17-jdk
          sudo update-java-alternatives -s java-1.17.0-openjdk-amd64

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup CCache
        run: |
          mkdir -p $CCACHE_DIR
          ccache -o max_size=$CCACHE_MAXSIZE
          ccache -o compression=true
          ccache -o compression_level=1

      - name: Cache .repo (git objects)
        id: cache-repo
        uses: actions/cache@v4
        with:
          path: ~/android/lineage/.repo
          key: lineage-repo-${{ env.LINEAGE_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            lineage-repo-${{ env.LINEAGE_BRANCH }}-

      - name: Initialize LineageOS Source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"
          ~/bin/repo init -u https://github.com/LineageOS/android.git \
            -b ${{ env.LINEAGE_BRANCH }} \
            --depth=1

      - name: Sync LineageOS Source
        run: |
          cd ~/android/lineage
          if [ -d .repo/projects ]; then
            echo "=== Cache HIT: restoring working tree from .repo objects ==="
            ~/bin/repo sync -l -j$(nproc --all) 2>&1
            echo "=== Fetching new changes since last cache ==="
            ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags 2>&1
          else
            echo "=== Cache MISS: full source sync ==="
            ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          fi
          echo "=== Disk Usage After Sync ==="
          df -h
        shell: bash
        timeout-minutes: 120

      - name: Clone Device Tree
        run: |
          mkdir -p ~/android/lineage/device/tecno
          git clone --depth=1 $DEVICE_TREE_URL \
            ~/android/lineage/device/tecno/LJ6

      - name: Clone Vendor Tree
        run: |
          mkdir -p ~/android/lineage/vendor/tecno
          git clone --depth=1 $VENDOR_TREE_URL \
            ~/android/lineage/vendor/tecno/LJ6

      - name: Clone Common Vendor Tree
        run: |
          mkdir -p ~/android/lineage/vendor/tecno
          git clone --depth=1 $VENDOR_COMMON_URL \
            ~/android/lineage/vendor/tecno/mt6789-common

      - name: Set up Swap (OOM Mitigation)
        run: |
          if swapon --show | grep -q .; then
            echo "Swap already active, skipping creation"
          else
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          swapon --show
          free -h

      - name: Set up Build Environment
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast ${{ env.DEVICE }} ${{ env.BUILD_TYPE }}
        shell: bash

      - name: Build ROM
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CCACHE_EXEC=$(which ccache)
          export ANDROID_JACK_VM_ARGS="-Xmx4096m"
          make -j2 bacon 2>&1 | tee build.log
        shell: bash
        timeout-minutes: 360

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineage-${{ env.DEVICE }}-${{ env.BUILD_TYPE }}
          path: |
            ~/android/lineage/out/target/product/${{ env.DEVICE }}/lineage-*.zip
            ~/android/lineage/out/target/product/${{ env.DEVICE }}/boot.img
            ~/android/lineage/out/target/product/${{ env.DEVICE }}/dtbo.img
            ~/android/lineage/out/target/product/${{ env.DEVICE }}/vbmeta*.img
            ~/android/lineage/out/target/product/${{ env.DEVICE }}/super.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/android/lineage/build.log
          retention-days: 30

      - name: Show CCache Stats
        if: always()
        run: ccache -s

      - name: Show Disk Usage
        if: always()
        run: df -h
